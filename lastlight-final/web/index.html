        <h1>LASTLIGHT: land where the light lasts</h1>
        <p>At the lunar south pole the Sun skims the horizon. One ridge in the wrong place and a lander goes dark: Athena (IM-2) landed at Mons Mouton on 6 March 2025 and went silent in under 13 hours.</p>
        <p>LASTLIGHT answers one question before launch: if a lander aims at this site on this day, what is the chance it still has power after 14 days?</p>
        <ul>
          <li>Terrain: NASA LRO LOLA. Sun and Earth: NASA/JPL NAIF SPICE ephemerides, every hour of 2027–2030.</li>
          <li>The nine NASA Artemis III candidate regions; 1,000 simulated landings per day with landing error, slope and tip-over; 13,023,000 landings in all.</li>
          <li>Best day found: Malapert Massif, 15 October 2029, 96.4% of a generic lander's simulated landings keep their power for 14 days (95% interval 95.1–97.4%). This is a power-survival index for comparing sites and days, not the chance a real mission succeeds. Only Malapert reaches 95% with this generic lander.</li>
          <li>Sun and Earth angles agree with an independent calculator to 0.014°, itself within 0.004° of NASA JPL Horizons. Sunlight was checked against LROC photographs at the one region inside their map (87% lit in the photos, 61% in our model: pessimistic on power). No machine learning; every number comes from the pipeline’s files.</li>
        </ul>
